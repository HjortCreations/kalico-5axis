# This file is an example config for a Hybrid-CoreXY printer with a bed
# supported by exactly three independently driven Z motors. It is intended for
# RatOS-style hybrid gantries with a CoreXY motor pair and extra Y motors.
#
# The bed pivot height is Z, rotation about X is A, and rotation about Y is B.
#
# DO NOT COPY THIS FILE WITHOUT CAREFULLY READING AND UPDATING IT FIRST.
# Incorrectly configured parameters may cause damage.
#
# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
# First CoreXY motor
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_x1]
# Second CoreXY motor
step_pin: PH1
dir_pin: !PH0
enable_pin: !PA1
microsteps: 16
rotation_distance: 40

[stepper_y]
# First Y assist motor
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_y1]
# Second Y assist motor
step_pin: PC1
dir_pin: !PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 40

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 300

[stepper_z1]
step_pin: PB5
dir_pin: PB6
enable_pin: !PB7
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD2

[stepper_z2]
step_pin: PK1
dir_pin: PK2
enable_pin: !PK3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD1

[hybrid_corexy_3z_tilt]
# Coordinates of the Z supports in stepper_z, stepper_z1, stepper_z2 order.
z_positions:
    0,0
    300,0
    150,300
# XYZ positions are expressed at this virtual bed pivot.
pivot_position: 150,150
max_a: 5
max_b: 5
max_a_velocity: 2
max_b_velocity: 2
max_a_accel: 2
max_b_accel: 2

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PH6

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: hybrid_corexy_3z_tilt
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 30
